name: Publish (crawl + Pages)

# Runs on a nightly schedule, and on demand from the Actions tab →
# "Publish (crawl + Pages)" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Crawl scope
        type: choice
        default: site
        options: [site, single]
      url:
        description: Target URL (single mode only)
        type: string
        default: https://www.atherenergy.com/contact
      maxDepth:
        description: Recursion depth (site mode)
        type: string
        default: "1"
      maxPages:
        description: Page cap (site mode)
        type: string
        default: "30"
  schedule:
    # Nightly at 00:30 UTC. Scheduled runs have no inputs, so the env below
    # falls back to a site crawl (depth 1, 30 pages).
    - cron: "30 0 * * *"

permissions:
  contents: write # push accumulated results to the crawl-data branch
  pages: write
  id-token: write

# Only one Pages deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Restore prior crawl history (crawl-data branch)
        run: |
          mkdir -p apps/web/public/data
          if git clone --depth=1 --branch crawl-data \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/prev 2>/dev/null; then
            cp -r /tmp/prev/data/. apps/web/public/data/ 2>/dev/null || true
            echo "restored prior runs: $(ls -1 apps/web/public/data 2>/dev/null | grep -v jobs.json | wc -l)"
          else
            echo "no crawl-data branch yet — starting fresh history"
          fi

      - name: Crawl → static JSON + screenshots
        run: npm run crawl:static
        env:
          # `inputs.*` are empty on scheduled runs — fall back to a site crawl.
          CRAWL_MODE: ${{ inputs.mode || 'site' }}
          CRAWL_URL: ${{ inputs.url || 'https://www.atherenergy.com/contact' }}
          CRAWL_MAX_DEPTH: ${{ inputs.maxDepth || '1' }}
          CRAWL_MAX_PAGES: ${{ inputs.maxPages || '30' }}

      - name: Build dashboard (static mode)
        run: npm run build
        env:
          VITE_STATIC: "1"
          VITE_BASE: /website_bug_finder/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Persist crawl history (crawl-data branch)
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/data"
          cp -r apps/web/public/data/. "$tmp/data/" 2>/dev/null || true
          cd "$tmp"
          git init -q
          git checkout -q -b crawl-data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "crawl data (run ${{ github.run_number }})" || { echo "nothing to persist"; exit 0; }
          # Orphan force-push keeps only the latest snapshot (which already holds the capped history).
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" crawl-data

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
